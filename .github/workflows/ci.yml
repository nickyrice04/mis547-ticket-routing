# Continuous integration and delivery for the ticket router.
#
# On every push and pull request:
#   test        unit tests of the API contract, drift rules and preprocessing (fake model, seconds)
#   sast        Semgrep static analysis of the shipped code (Python, security audit, secrets rules)
#   secrets     Gitleaks over the full git history, so a key can never slip in unnoticed
#   deps        pip-audit of the pinned runtime dependencies against known vulnerabilities
#   terraform   fmt and validate of the infrastructure code (no credentials needed)
#   image       builds the inference image, Trivy scans it (fails on fixable CRITICAL
#               vulnerabilities), attaches a CycloneDX SBOM, and on main publishes it to
#               GitHub Container Registry as :main and :<commit>
#
# Deployment is pull-based: the inference droplet checks the registry every five minutes
# (deploy/update.sh) and rolls to a new :main image with a health check and rollback.
# CI therefore holds no cloud credentials and no SSH key.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test dependencies (pinned like the runtime)
        run: pip install numpy==2.5.3 fastapi==0.141.1 pydantic==2.13.5 sqlalchemy==2.1.1 prometheus-client==0.26.0 httpx==0.28.1 pytest==9.1.1
      - name: Unit tests
        run: pytest -q

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (research scripts under src/experiments are not deployed and not scanned)
        run: >
          semgrep scan --metrics=off --error
          --config p/python --config p/security-audit --config p/secrets
          src/final src/serve src/mlops src/common.py deploy infra Dockerfile

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks over the whole history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact --no-banner --exit-code 1

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit of the runtime dependencies
        run: |
          pip install pip-audit
          pip-audit --requirement docker/requirements-api.txt --progress-spinner off

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  image:
    needs: [test, sast, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the 4 GB image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: >
          docker build
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t "$IMAGE:${{ github.sha }}" .
      - name: Trivy vulnerability scan (fails on fixable CRITICAL, reports HIGH)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format table "$IMAGE:${{ github.sha }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet "$IMAGE:${{ github.sha }}"
      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:latest image \
            --format cyclonedx --output /out/sbom-cyclonedx.json "$IMAGE:${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
      - name: Publish to GitHub Container Registry (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:main"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"
