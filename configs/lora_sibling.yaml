# Teach Qwen3.5 0.8B to rewrite a ticket the way this dataset rewrites tickets.
#
# The prompt is a real core ticket. The answer is one of its real siblings, a
# ticket in the same queue with cosine 0.40 to 0.85 to it. mask_prompt puts all
# of the loss on writing the sibling. One pass over 7,000 pairs.
#
# The base is the full precision model, since it trains about twice as fast on
# this machine as the 8-bit one and the adapter works with either.

model: mlx-community/Qwen3.5-0.8B-bf16
train: true
data: data/lora_sibling
adapter_path: adapters/qwen35_sibling

fine_tune_type: lora
optimizer: adamw
num_layers: 16
batch_size: 4
grad_accumulation_steps: 4
iters: 1750
max_seq_length: 512
mask_prompt: true
grad_checkpoint: true

learning_rate: 1e-4
lr_schedule:
  name: cosine_decay
  warmup: 40
  arguments: [1e-4, 1750, 1e-5]

steps_per_report: 50
steps_per_eval: 500
val_batches: 50
save_every: 500
seed: 42

lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
