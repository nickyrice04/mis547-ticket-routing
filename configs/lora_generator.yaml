# Teach Qwen3.5 0.8B to write tickets in this dataset's own style.
#
# The prompt is a ticket's queue, type, priority and tags. The answer is that
# ticket's real subject and body. mask_prompt puts all the loss on writing the
# ticket. One pass over the core training tickets, since more passes push the
# model toward memorizing tickets instead of learning how they read.

model: mlx-community/Qwen3.5-0.8B-MLX-8bit
train: true
data: data/lora_generator
adapter_path: adapters/qwen35_generator

fine_tune_type: lora
optimizer: adamw
num_layers: 16
batch_size: 4
iters: 4000
max_seq_length: 512
mask_prompt: true
grad_checkpoint: true
grad_accumulation_steps: 4

learning_rate: 1e-4
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1e-4, 1000, 1e-5]

steps_per_report: 200
steps_per_eval: 1000
val_batches: 100
save_every: 1000
seed: 42

lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
