# The inference droplet's stack, started by the ticket-router systemd unit.
#
#   caddy       public entry point. HTTPS with an automatic Let's Encrypt certificate,
#               HTTP redirected to HTTPS, security headers, request size limit, /metrics blocked
#   api         the router (Dockerfile at the repo root). No published port, so it is
#               reachable only through Caddy on the Compose network
#   prometheus  scrapes the API's /metrics every 15 s and keeps 30 days. Bound to the
#               droplet's loopback only, viewed through an SSH tunnel
#
# Variables come from /etc/ticket-routing/compose.env (SITE_ADDRESS, API_IMAGE, ACME_EMAIL)
# and the API's secrets from /etc/ticket-routing/api.env, both root-only, neither in git.

name: ticket-router

services:
  api:
    image: ${API_IMAGE:-ghcr.io/nickyrice04/mis547-ticket-routing:main}
    build:
      context: ..
    restart: unless-stopped
    env_file: /etc/ticket-routing/api.env
    volumes:
      - models:/models
    expose:
      - "8000"
    mem_limit: 3g
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in compose.env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

volumes:
  models:
  caddy_data:
  caddy_config:
  prometheus_data:
